<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Odzyskanie dostępu · AKP Commander</title><link rel="stylesheet" href="/recovery.css"><script src="/recovery.js" defer></script></head>
<body><main><a class="brand" href="/">AKP <span>COMMANDER</span></a><p class="eyebrow">BEZPIECZNY DOSTĘP</p><h1>Odzyskaj dostęp.</h1><p id="intro">Podaj adres konta AKP. Otrzymasz link do ustawienia nowego hasła.</p>
<form id="requestForm"><label for="email">Adres e-mail</label><input id="email" name="email" type="email" autocomplete="username" required><button type="submit">Wyślij link do ustawienia hasła</button></form>
<form id="passwordForm" hidden><label for="newPassword">Nowe hasło</label><input id="newPassword" name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required><label for="confirmPassword">Powtórz nowe hasło</label><input id="confirmPassword" name="confirm_password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required><p class="hint">Co najmniej 12 znaków. Zapisz hasło w swoim menedżerze haseł.</p><button type="submit">Ustaw nowe hasło</button></form>
<p id="message" role="status" aria-live="polite"></p><a id="loginLink" href="/login">← Przejdź do logowania</a></main></body></html>
